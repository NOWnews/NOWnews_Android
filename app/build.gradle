apply plugin: 'com.android.application'
apply plugin: 'com.jakewharton.butterknife'

repositories {
    mavenCentral()
    //comscore
//    maven{
//        url 'https://comscore.bintray.com/Analytics'
//    }
    maven {
        url "https://maven.google.com"
    }
    maven {
        url 'https://raw.githubusercontent.com/VMFive/android-sdk-3.0/master/VMFiveADNSDK/'
    }
    flatDir {
        dirs 'libs'
    }
}

configurations.all {
    resolutionStrategy.cacheDynamicVersionsFor(0, 'seconds')
}

android {
    compileSdkVersion 26
    buildToolsVersion "26.0.1"
    defaultConfig {
        applicationId "com.nownews"
        minSdkVersion 15
        targetSdkVersion 25
        versionCode 2017080901
        versionName "8.3.5(1)"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES.txt'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/dependencies.txt'
        exclude 'META-INF/LGPL2.1'
        exclude 'jsr305_annotations/Jsr305_annotations.gwt.xml'
    }
    dependencies {
        compile(name: 'cmadsdk_world_base_V3.4.8', ext: 'aar')
        compile fileTree(include: ['*.jar'], dir: 'libs')
        androidTestCompile('com.android.support.test.espresso:espresso-core:2.2.2', {
            exclude group: 'com.android.support', module: 'support-annotations'
        })

//    Firebase
        compile 'com.google.firebase:firebase-crash:11.0.1'
        compile 'com.google.firebase:firebase-core:11.0.1'
        compile 'com.google.firebase:firebase-ads:11.0.1'
        compile 'com.google.firebase:firebase-auth:11.0.1'
        compile 'com.google.firebase:firebase-messaging:11.0.1'
        compile 'com.google.firebase:firebase-invites:11.0.1'
        compile 'com.google.firebase:firebase-ads:11.0.1' //For ad2

//    Android Support
        compile 'com.android.support:cardview-v7:26.0.1'
        compile 'com.android.support:appcompat-v7:26.0.1'
        compile 'com.android.support:support-v4:26.0.1'
        compile 'com.android.support:design:26.0.1'
        compile 'com.android.support:recyclerview-v7:26.0.1'
        compile 'com.android.support:customtabs:26.0.1'
        compile 'com.android.support:support-v13:26.0.1'
        compile 'com.android.support:multidex:1.0.2'

//    For Web Api
        compile 'com.google.code.gson:gson:2.7'
        compile 'com.github.bumptech.glide:okhttp3-integration:4.0.0-RC1'
        compile 'com.fasterxml.jackson.core:jackson-core:2.8.0'
        compile 'com.fasterxml.jackson.core:jackson-annotations:2.8.0'
        compile 'com.fasterxml.jackson.core:jackson-databind:2.8.0'

//    For UI
        compile 'com.afollestad.material-dialogs:commons:0.9.4.5'
        compile 'com.afollestad.material-dialogs:core:0.9.4.5'
        compile 'com.aurelhubert:ahbottomnavigation:2.0.2'
        compile 'com.facebook.android:facebook-android-sdk:[4,5)'
        compile 'com.jakewharton:butterknife:8.5.1'
        annotationProcessor 'com.jakewharton:butterknife-compiler:8.5.1'

//    For Analytics
        compile 'com.google.android.gms:play-services-analytics:11.0.1'
//        compile 'com.comscore:android-analytics:5.+'

//    For Ad2
        // Ad2一般廣告
        compile project(':ad2iction-sdk')
        // Ad2進階互動廣告
        compile 'com.google.android.gms:play-services-vision:11.0.1'
        // Ad2廣告聯聯播網轉接器
        compile project(':ad2iction-mediation-adapter')
        compile project(':imagedownloadmanager')

//    For VM5
        compile 'com.google.android.gms:play-services-ads:11.0.1'
        debugCompile 'com.vmfive:VMFiveADNSDK:+:debug@aar'
        releaseCompile 'com.vmfive:VMFiveADNSDK:+:release@aar'

//    Other
        testCompile 'junit:junit:4.12'
        compile 'joda-time:joda-time:+'

    }
}


apply plugin: 'com.google.gms.google-services'
dependencies {
    implementation 'com.android.support:support-v4:26.0.1'
}
