apply plugin: 'com.android.application'

repositories {
    mavenCentral()
    //comscore
    maven{
        url 'https://comscore.bintray.com/Analytics'
    }
    maven{
        name "Tapjoy's maven repo"
        url 'https://tapjoy.bintray.com/maven'
    }
    flatDir {
        dirs 'libs'
    }
}

android {
    compileSdkVersion 25
    buildToolsVersion "25.0.0"
    defaultConfig {
        applicationId "com.nownews"
        minSdkVersion 15
        targetSdkVersion 20
        versionCode 2017032301
        versionName "8.2.9"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    compile(name: 'cmadsdk_world_base_V3.4.8', ext: 'aar')
    compile fileTree(include: ['*.jar'], dir: 'libs')
    androidTestCompile('com.android.support.test.espresso:espresso-core:2.2.2', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    compile 'com.android.support:cardview-v7:25.1.0'
    compile 'com.android.support:appcompat-v7:25.1.0'
    compile 'com.android.support:support-v4:25.1.0'
    compile 'com.android.support:design:25.1.0'
    compile 'com.android.support:recyclerview-v7:25.1.0'
    compile 'com.android.support:customtabs:25.1.0'
    compile 'com.android.support:multidex:1.0.0'
    compile 'com.google.code.gson:gson:2.7'
    compile 'com.google.firebase:firebase-crash:10.0.1'
    compile 'com.google.firebase:firebase-core:10.0.1'
    compile 'com.google.firebase:firebase-ads:10.0.1'
    compile 'com.google.firebase:firebase-auth:10.0.1'
    compile 'com.google.firebase:firebase-messaging:10.0.1'
    compile 'com.google.android.gms:play-services-analytics:10.0.1'
    compile 'com.afollestad.material-dialogs:commons:0.9.0.2'
    compile 'com.afollestad.material-dialogs:core:0.9.0.2'
    compile 'com.aurelhubert:ahbottomnavigation:2.0.2'
    compile 'com.squareup.okhttp:okhttp:2.4.0'
    compile 'com.facebook.android:facebook-android-sdk:[4,5)'
    compile 'com.github.bumptech.glide:glide:3.7.0'
    compile 'com.google.firebase:firebase-invites:10.0.1'
    testCompile 'junit:junit:4.12'
    compile 'com.comscore:android-analytics:5.+'
    compile 'com.tapjoy:tapjoy-android-sdk:11.7.0@aar'
}

apply plugin: 'com.google.gms.google-services'
